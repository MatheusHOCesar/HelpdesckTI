<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Helpdesk de TI</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        .form-section { background: #f9f9f9; padding: 15px; border-radius: 5px; margin-bottom: 20px; border: 1px solid #ddd; }
        input, textarea, select { width: 100%; margin-bottom: 15px; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background-color: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #218838; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background-color: #007bff; color: white; }
        tr:nth-child(even) { background-color: #f2f2f2; }
    </style>
</head>
<body>
    <div class="container">
        <div class="form-section">
            <h2>Abrir Novo Chamado</h2>
            <form id="formChamado">
                <input type="text" id="titulo" placeholder="Título do problema (Ex: Internet caindo)" required>
                <textarea id="descricao" rows="3" placeholder="Descrição detalhada do problema" required></textarea>
                <select id="usuario_id">
                    <option value="1">Mike (Engenharia)</option>
                    <option value="2">Ana (RH)</option>
                </select>
                <button type="submit">Enviar Chamado</button>
            </form>
            <div id="resultado" style="margin-top: 10px; font-weight: bold; text-align: center;"></div>
        </div>


        <h2>Chamados Registrados</h2>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Título</th>
                    <th>Descrição</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="tabelaChamados">
            </tbody>
        </table>
    </div>

    <script>
        async function carregarChamados() {
            try {
                const response = await fetch('/api/chamados');
                const chamados = await response.json();
                
                const tbody = document.getElementById('tabelaChamados');
                tbody.innerHTML = '';
                
                const opcoesStatus = ['Aberto', 'Em Andamento', 'Resolvido'];
                
                chamados.forEach(chamado => {
                    let selectHTML = `<select onchange="alterarStatus(${chamado.id}, this.value)">`;
                    opcoesStatus.forEach(opcao => {
                        let selecionado = chamado.status === opcao ? "selected" : "";
                        selectHTML += `<option value="${opcao}" ${selecionado}>${opcao}</option>`;
                    });
                    selectHTML += `</select>`;

                    tbody.innerHTML += `
                        <tr>
                            <td>#${chamado.id}</td>
                            <td>${chamado.titulo}</td>
                            <td>${chamado.descricao}</td>
                            <td>${selectHTML}</td>
                        </tr>
                    `;
                });
            } catch (error) {
                console.error("Erro ao carregar a tabela:", error);
            }
        }

        async function alterarStatus(id, novoStatus) {
            try {
                const response = await fetch(`/api/chamados/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status: novoStatus })
                });
                if(!response.ok) throw new Error();
            } catch(e) {
                alert("Erro ao alterar o status.");
                carregarChamados();
            }
        }

        document.getElementById('formChamado').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.querySelector('button');
            btn.innerText = "Enviando...";
            
            const dados = {
                titulo: document.getElementById('titulo').value,
                descricao: document.getElementById('descricao').value,
                usuario_id: parseInt(document.getElementById('usuario_id').value)
            };

            try {
                const response = await fetch('/api/chamados', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(dados)
                });

                if(response.ok) {
                    document.getElementById('resultado').style.color = 'green';
                    document.getElementById('resultado').innerText = "Chamado adicionado!";
                    document.getElementById('formChamado').reset();
                    
                    carregarChamados(); 
                } else {
                    throw new Error("Falha na API");
                }
            } catch (error) {
                document.getElementById('resultado').style.color = 'red';
                document.getElementById('resultado').innerText = "Erro ao salvar no banco.";
            } finally {
                btn.innerText = "Enviar Chamado";
                setTimeout(() => document.getElementById('resultado').innerText = "", 3000);
            }
        });

        window.onload = carregarChamados;
    </script>
</body>
</html>
